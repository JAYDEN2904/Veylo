# Supabase project config — used by `supabase` CLI when linked.
# Run `supabase link --project-ref <your-ref>` to bind a remote project.

project_id = "veylo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Align with linked hosted project (see warning from `supabase link`).
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""

# Edge Functions — per-function verify_jwt. JWT verified inside our handlers,
# but we leave it on here for defense in depth.
[functions.tag-item]
verify_jwt = true

[functions.tryon-generate]
verify_jwt = true

[functions.generate-embedding]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.weather-enrich]
verify_jwt = true

[functions.generate-outfit-ideas]
verify_jwt = true

[functions.tryon-status]
verify_jwt = true

[functions.recommend-items]
verify_jwt = true

[functions.style-chat]
verify_jwt = true

[functions.generate-avatar]
verify_jwt = true

[functions.moderate-image]
verify_jwt = true

[functions.feed-create-post]
verify_jwt = true

[functions.feed-list]
verify_jwt = true

[functions.feed-toggle-like]
verify_jwt = true

[functions.feed-add-comment]
verify_jwt = true

[functions.feed-follow]
verify_jwt = true

[functions.notifications-send]
verify_jwt = true

[functions.digest-weekly]
verify_jwt = false

[functions.gamification-events]
verify_jwt = true

[functions.embeddings-backfill]
verify_jwt = false

[analytics]
enabled = false
